name: Release

# 雙平台發布（ADR-010）：Windows(.exe, msvc 靜態 CRT) + Linux(musl 靜態)。
# 觸發：push tag v*（正式發布）或手動 workflow_dispatch（指定 tag）。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release 版本標籤（例：v0.1.0）'
        required: true

permissions:
  contents: write   # 建立 Release 需要

jobs:
  build:
    name: build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            bin: cytrace
            asset: cytrace-x86_64-linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: cytrace.exe
            asset: cytrace-x86_64-windows.exe
    steps:
      - uses: actions/checkout@v4

      # tag 與 Cargo.toml 版本失同步已實際出貨兩次（v0.2.0/v0.2.1 的 binary 都自報
      # 0.1.0），且冒煙只印 --version 不比對——散文擋不住的用機械閘擋
      #（release 準備複審 blocker/major #0/#3）。
      - name: tag ↔ Cargo.toml 版本一致（失同步即擋下發布）
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"; TAG="${TAG#v}"
          fi
          CARGO=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          if [ "$TAG" != "$CARGO" ]; then
            echo "✗ tag v$TAG 與 Cargo.toml $CARGO 不一致——binary 會自報錯誤版本"
            echo "  修法：bump Cargo.toml（連同 Cargo.lock）到 $TAG 再重新打 tag"
            exit 1
          fi
          echo "✓ 版本一致：$TAG"

      - name: Install musl tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build（靜態：musl / msvc crt-static）
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked --target ${{ matrix.target }} -p cytrace-cli

      - name: 冒煙測試（--version 比對 + CBOM 降級路徑）
        shell: bash
        run: |
          BIN=./target/${{ matrix.target }}/release/${{ matrix.bin }}
          OUT=$("$BIN" --version)
          echo "$OUT"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"; TAG="${TAG#v}"
          fi
          case "$OUT" in *"$TAG"*) echo "✓ --version 含 $TAG";;
            *) echo "✗ --version 未含 tag 版本 $TAG"; exit 1;;
          esac
          # CBOM 降級冒煙：release binary 不附引擎，--cbom 必須降級為「未盤點」而非 crash
          #（tag 管線對 CBOM 原本零覆蓋；release 準備複審 major #7）。
          # runner 上無 syft，scan 應以引擎缺席類錯誤結束（非 0 但非 panic/崩潰碼）。
          mkdir -p /tmp/smoke && echo x > /tmp/smoke/a.txt 2>/dev/null || true
          set +e
          "$BIN" scan /tmp/smoke --cbom --lang en-US > smoke.log 2>&1
          RC=$?
          set -e
          cat smoke.log
          if [ "$RC" -ge 128 ] || grep -qiE "panicked|RUST_BACKTRACE" smoke.log; then
            echo "✗ --cbom 在無引擎環境崩潰（RC=$RC）"; exit 1
          fi
          echo "✓ --cbom 無引擎時以受控錯誤結束（RC=$RC）"

      - name: 整理產物
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: 建立 GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      # 說明取自 CHANGELOG.md（scripts/release-notes.py），故需要原始碼
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 蒐集執行檔 + 產 SHA256SUMS
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          cd release
          sha256sum * > SHA256SUMS
          echo "── Release 內容 ──"; ls -la; echo; cat SHA256SUMS

      - name: 解析版本標籤
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      # 說明由 CHANGELOG.md 該版段落組出——不在此寫死：先前「已知限制（v0.3.0）」逐字寫在
      # 這裡，下一版會原樣印出上一版的限制。缺段落或標頭未標日期即擋下發布。
      - name: 組 Release 說明（取自 CHANGELOG.md）
        run: python3 scripts/release-notes.py render "${{ steps.tag.outputs.tag }}" > release-notes.md

      - name: 發布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: CyTrace ${{ steps.tag.outputs.tag }}
          files: release/*
          generate_release_notes: true
          # 本 workflow 是 Release 說明的唯一擁有者（scripts/release-notes.py check 把關）
          body_path: release-notes.md
