name: Docker（GHCR）

# 容器交付（ADR-012）：PR 只 build + 冒煙不 push；tag v* 冒煙通過才 push GHCR。
# 獨立於 release.yml（權限最小化：此處 packages:write）。
on:
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker.yml
      - 'crates/**'
      - 'frontend/**'
      - 'locales/**'
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - scripts/versions.env
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'image tag（如 v0.2.0）'
        required: true

permissions:
  contents: write # 附 Release 資產
  packages: write # push GHCR

jobs:
  docker:
    name: build / 冒煙 /（tag 時）push + Release 資產
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 引擎版本（單一事實源；只取 KEY=VALUE，濾掉註解與空行）
        run: grep -E '^[A-Za-z_][A-Za-z0-9_]*=' scripts/versions.env >> "$GITHUB_ENV"

      - name: 決定 release tag（tag push 或 workflow_dispatch 皆算 release）
        id: rel
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: metadata（image 名 + OCI labels + tags）
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/astroicers/cytrace
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            # PR 專用（產出 pr-<n>）：上面三條規則在 pull_request 事件下全部不適用，
            # 於是 tags 為空 → build 無標籤 → 後續 `docker run --rm "$IMG"` 拿到空字串而失敗
            #   ##[warning]No Docker image version has been generated. Check tags input.
            # PR 不 push，標籤只是給本機 load 的 image 一個名字供冒煙使用。
            # 與 provenance 那條同一個既有缺陷家族：整條 PR 路徑（load → 冒煙）從未跑過，
            # 因為此 repo 在本分支之前從未開過 PR。
            type=ref,event=pr

      # tag / dispatch 時登入 GHCR（PR 不登入、不 push）
      - name: GHCR login
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build（一律 load 本機供冒煙；push 在冒煙後的第二段）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SYFT_VERSION=${{ env.SYFT_VERSION }}
            GRYPE_VERSION=${{ env.GRYPE_VERSION }}
            SYFT_LINUX_AMD64_SHA256=${{ env.SYFT_LINUX_AMD64_SHA256 }}
            GRYPE_LINUX_AMD64_SHA256=${{ env.GRYPE_LINUX_AMD64_SHA256 }}
            THEIA_COMMIT=${{ env.THEIA_COMMIT }}
            THEIA_LINUX_AMD64_SHA256=${{ env.THEIA_LINUX_AMD64_SHA256 }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 第一段 build 一律 load 本機供冒煙、關 attestation——provenance/sbom 會讓
          # buildx 產出 manifest list（即使單平台），而 load 用的 docker exporter 不支援：
          #   ERROR: docker exporter does not currently support exporting manifest lists
          # 供應鏈 attestation 只有交付物需要，由冒煙後的第二段 push 帶上（見下）。
          provenance: false
          sbom: false

      # 冒煙：PR 與 tag 都對 load 進本機的 image 跑，**通過才 push**——
      # 原實作 push（含 latest）先於冒煙，冒煙失敗時壞 image 已公開且 GHCR 留殘檔
      # （v0.2.0 前例；release 準備複審 finding #10）。兩段式的第二段吃 gha cache，
      # 重建成本近零。
      - name: 冒煙 --version（release 時比對 tag——容器路徑的版本閘）
        run: |
          IMG=$(echo '${{ steps.meta.outputs.tags }}' | head -1)
          OUT=$(docker run --rm "$IMG" --version)
          echo "$OUT"
          # release.yml 的版本閘只蓋 binaries 路徑；少了這段，錯版 binary 仍可經
          # 容器路徑出到 GHCR 與 Release tar（release-prep 複審 major #10）。
          # PR 時 is_release=false，無 tag 可比，跳過。
          if [ "${{ steps.rel.outputs.is_release }}" = "true" ]; then
            TAG="${{ steps.rel.outputs.tag }}"; TAG="${TAG#v}"
            case "$OUT" in *"$TAG"*) echo "✓ image 內 binary 自報版本含 $TAG";;
              *) echo "✗ image 內 binary 版本與 tag $TAG 不符——擋下發布"; exit 1;;
            esac
          fi

      - name: 冒煙 serve（degraded 起站 → /healthz 200）
        run: |
          IMG=$(echo '${{ steps.meta.outputs.tags }}' | head -1)
          # 合法 argon2id PHC（serve 啟動驗格式；此容器即拋棄、密碼無意義）
          PHC='$argon2id$v=19$m=19456,t=2,p=1$bzvUjuXne+hdTJnsojWpbg$qz0SOdij/7ypT71lOiVcDJ66kHf0emAojQA0hzTE3IY'
          docker run -d --name cytrace-smoke --read-only --tmpfs /tmp \
            -e CYTRACE_ADMIN_PASSWORD_HASH="$PHC" -p 18443:8443 "$IMG" serve
          sleep 3
          curl -fsS http://127.0.0.1:18443/healthz
          docker logs cytrace-smoke
          docker rm -f cytrace-smoke

      # 冒煙通過 → 第二段：push 到 GHCR（帶供應鏈 attestation；gha cache 命中，秒級）
      - name: push（冒煙通過後；tag / dispatch 才跑）
        if: steps.rel.outputs.is_release == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SYFT_VERSION=${{ env.SYFT_VERSION }}
            GRYPE_VERSION=${{ env.GRYPE_VERSION }}
            SYFT_LINUX_AMD64_SHA256=${{ env.SYFT_LINUX_AMD64_SHA256 }}
            GRYPE_LINUX_AMD64_SHA256=${{ env.GRYPE_LINUX_AMD64_SHA256 }}
            THEIA_COMMIT=${{ env.THEIA_COMMIT }}
            THEIA_LINUX_AMD64_SHA256=${{ env.THEIA_LINUX_AMD64_SHA256 }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      # release（tag push 或 workflow_dispatch）：docker save + SHA256SUMS + image SBOM → 掛 Release
      - name: 產離線 tar + SBOM + digest
        if: steps.rel.outputs.is_release == 'true'
        run: |
          VER=${{ steps.rel.outputs.tag }}
          # 用 metadata 產出的精確 push tag（不自行重組，避免 v 前綴不一致）
          IMG=$(echo '${{ steps.meta.outputs.tags }}' | head -1)
          # push（load:false）後 image 不在本地，docker save 需先 pull 回來
          docker pull "$IMG"
          docker save "$IMG" -o "cytrace-${VER}-image.tar"
          # 檔名**不得**叫 SHA256SUMS：release.yml 已用該名上傳 binaries 的校驗檔，
          # 同一個 Release 上同名資產後到者覆蓋先到者——v0.2.0/v0.2.1 實證 image tar
          # 最終無校驗和、SOP §7.1 的 sha256sum -c 必失敗（release 準備複審 blocker）。
          sha256sum "cytrace-${VER}-image.tar" > SHA256SUMS-image
          docker buildx imagetools inspect "$IMG" --format '{{.Manifest.Digest}}' > IMAGE_DIGEST.txt || \
            docker inspect "$IMG" --format '{{index .RepoDigests 0}}' > IMAGE_DIGEST.txt
          # image SBOM（dogfooding）：用 image 內建 syft 掃剛存的 tar。
          # --user 0:0：syft 預設非 root（65532）讀不到 host 掛入的 tar；chmod a+r 補讀權。
          # 失敗不留空檔（否則 Release 上傳報 size must be >= 1）。
          chmod a+r "cytrace-${VER}-image.tar"
          if docker run --rm --entrypoint syft --user 0:0 -v "$PWD":/w -w /w "$IMG" \
               "docker-archive:cytrace-${VER}-image.tar" -o cyclonedx-json 2>/dev/null \
               > cytrace-image.sbom.cdx.json && [ -s cytrace-image.sbom.cdx.json ]; then
            echo "✓ image SBOM 產生"
          else
            echo "SBOM 產生略過（非致命）"; rm -f cytrace-image.sbom.cdx.json
          fi

      - name: 附掛 Release 資產
        if: steps.rel.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          files: |
            cytrace-*-image.tar
            SHA256SUMS-image
            IMAGE_DIGEST.txt
            cytrace-image.sbom.cdx.json
          body: |
            容器映像（ADR-012）。離線搬運：見 docs/DELIVERY_SOP.md §7。
            校驗：`sha256sum -c SHA256SUMS-image`（binaries 的校驗檔是另一份 `SHA256SUMS`）。
            交付工作站以 minisign 簽 `cytrace-*-image.tar`（私鑰不進 CI）。
