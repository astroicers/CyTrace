name: CI

on:
  push:
    branches: [main, 'asp/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    name: Rust（fmt / clippy / test / golden）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain（釘選於 rust-toolchain.toml）
        run: rustup show
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy（-D warnings）
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test（含 golden baseline）
        run: cargo test --workspace
      - name: 純 CLI 可退（--no-default-features 零 tokio，CLI 零迴歸）
        run: cargo build --no-default-features -p cytrace-cli --locked
      - name: 零 HTTP client 依賴（零外連機械保證，ADR-011）
        run: |
          if cargo tree -e normal 2>/dev/null | grep -iE 'reqwest|hyper-tls|native-tls|(^| )ureq( |$)|(^| )curl( |$)'; then
            echo "✗ 依賴樹出現 HTTP client（違反零外連鐵則）"; exit 1
          else
            echo "✓ 依賴樹無 HTTP client"
          fi
      - name: i18n 鍵一致（NFR-06）
        run: python3 scripts/i18n-check.py
      # 兩支打包腳本各寫一份 NOTICE，改一邊忘一邊就出授權聲明不實的交付包。
      # 第二步驗哨兵本身：初版對整檔比對，NOTICE 刪光對應段仍綠（第七輪 blocker）；
      # 而「逐列變異」的判別力等於正常執行（第八輪 finding C），故改為對抽取邏輯注入故障。
      - name: NOTICE 兩平台對帳（ADR-013）
        run: |
          python3 scripts/notice-parity-check.py
          python3 scripts/notice-parity-check.py --verify-sentinels
      # v0.3.0 的公開 Release 頁被 docker.yml 的 body 整份覆蓋（softprops 更新既有 release 時
      # 給了 body 就取代），而 release.yml 又把「已知限制」寫死成上一版的內容。
      - name: Release 說明單一來源（CHANGELOG → release.yml；別的 workflow 不得寫 body）
        run: python3 scripts/release-notes.py check

  real-engine:
    name: 真引擎整合測試（CBOM × 真實輸入形態，ADR-013）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain（釘選於 rust-toolchain.toml）
        run: rustup show
      - name: 讀引擎釘選版本
        run: grep -E '^[A-Za-z_][A-Za-z0-9_]*=' scripts/versions.env >> "$GITHUB_ENV"
      # 與交付鏈同一條建置路徑（Dockerfile theia-builder stage），確保測的是會出貨的那支
      - name: 建置 cbomkit-theia（自源碼，驗 SHA256）
        run: |
          docker build --target theia-builder -t theia-builder .
          cid=$(docker create theia-builder)
          docker cp "$cid:/out/cbomkit-theia" /usr/local/bin/cbomkit-theia
          docker rm "$cid"
          chmod +x /usr/local/bin/cbomkit-theia
          echo "${THEIA_LINUX_AMD64_SHA256}  /usr/local/bin/cbomkit-theia" | sha256sum -c -
      # M9 六輪複審中，第四輪之後的全部阻斷級都只有真引擎跑得出來（零資產目標輸出 null、
      # dir 模式追隨 symlink、FIFO 掛死、OpenSSH 金鑰只在 stderr 留痕、憑證計數欄位名與想像不符）
      - name: 真引擎 × 真實輸入形態
        run: make test-real-engine

  supply-chain:
    name: 供應鏈（cargo-deny：license / 來源白名單 / advisories）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses sources bans
      # advisories 另一步驟：失敗時一眼看出是哪一類。CI 有網路，每次抓最新的 RustSec DB；
      # 新公告可能讓與它無關的 PR 轉紅——處置是升級、或在 deny.toml 以理由明列豁免（T913）。
      # 先前只跑上面那一步，4 則既有依賴的 advisory 從未在 CI 出現。
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories

  frontend:
    name: 前端（typecheck + 報表/console build + 零外連）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: install
        run: cd frontend && pnpm install --frozen-lockfile
      - name: typecheck
        run: cd frontend && pnpm typecheck
      # frontend/src/cbom.ts 是 Catalog::render_cbom 的第二份實作。Rust 側契約測試比對
      # 鍵清單與變數名規則，擋不到行為差異——實際漂開過兩次（空細節漏佔位符、en-US 夾全角），
      # 兩次都是報表會把該字面印給交件對象看。
      - name: CBOM 成因渲染（雙語 × 邊界，ADR-013）
        run: node --experimental-strip-types frontend/scripts/cbom-message-check.mts
      # 送給 server 的語系必須是畫面實際語系（i18n.resolvedLanguage），否則中文介面會跳
      # 英文錯誤、非 Latin-1 的存檔值會讓每次請求都被包成 network 錯誤（T909 對抗式複審 v19 反證票 0/3，仍防禦性修正；
      # 本檢查載入真的 client.ts / upload.ts 驗實際送出值——第二輪複審 lang#0 / tests#0）。
      - name: console 送出語系 == 畫面語系（T909）
        run: node --experimental-strip-types frontend/scripts/console-lang-check.mts
      # v0.4.0 的中文報表仍印英文表頭與 `Generated`；i18n-check 只驗被引用的鍵存在，
      # 看不見根本沒走 t() 的字串（T917）。
      - name: 前端無硬編碼使用者可見字串（T917）
        run: node --experimental-strip-types frontend/scripts/ui-literal-check.mts
      - name: build 報表（單檔內聯）
        run: cd frontend && pnpm build
      - name: 報表 sentinel 未污染（console 不得破壞注入契約 ADR-009）
        run: |
          if ! grep -q '<!--CYTRACE_DATA-->' frontend/dist/index.html; then
            echo "✗ 報表 sentinel 遺失（注入契約被破壞）"; exit 1
          fi
          echo "✓ 報表 sentinel 完整"
      - name: 零外連自檢（報表不得有外部 http(s) 資源）
        run: |
          if grep -nE 'src="https?://|href="https?://' frontend/dist/index.html; then
            echo "✗ 報表含外部資源（違反 air-gapped）"; exit 1
          else
            echo "✓ 報表零外部資源"
          fi
      - name: build console SPA
        run: cd frontend && pnpm build:console
      # 契約測試與渲染檢查讀的是 frontend/src/*.ts，**出貨的是 commit 進 repo 的產物**
      # （rust-embed 內嵌 report-template.html 與 assets/console/）。改了 src 卻忘了重產，
      # 所有檢查照樣全綠，而交付的是舊邏輯——與本分支一路修的病灶同型：
      # 「檢查一份東西、出貨另一份東西」（第十輪複審待補證據 3）。
      # 故在此比對重建產物與 commit 版本；不符即紅並指出要跑哪個 target。
      - name: 產物與源碼同步（rust-embed 內嵌的是 commit 版本）
        run: |
          cp frontend/dist/index.html crates/cytrace-report/assets/report-template.html
          rm -rf crates/cytrace-server/assets/console
          mkdir -p crates/cytrace-server/assets/console
          cp -r frontend/dist-console/. crates/cytrace-server/assets/console/
          # `git diff` 看不見**未追蹤**的新檔：產物多出一個沒被 index.html 參照的檔案時
          # 會靜默通過，而交件包內嵌的 assets/ 缺它（第十一輪複審 finding F）。
          if [ -n "$(git status --porcelain --untracked-files=all -- crates/cytrace-report/assets crates/cytrace-server/assets)" ]; then
            echo "✗ 內嵌產物與前端源碼不同步——改了 frontend/src 卻沒重產產物。"
            echo "  修法：make frontend && make frontend-console，然後把產物一併 commit。"
            git diff --stat -- crates/cytrace-report/assets crates/cytrace-server/assets
            exit 1
          fi
          echo "✓ 內嵌產物與源碼一致"
      - name: console 零外連自檢
        run: bash scripts/console-egress-check.sh frontend/dist-console

  # Windows 版 CBOM 引擎（T911）：在 Linux 上以 Dockerfile 的 theia-builder-windows stage
  # 交叉編譯——與 Linux 版同一份釘選源碼、同一個 Go image、同一組參數，產物比對 versions.env 的 SHA。
  theia-windows:
    name: cbomkit-theia Windows 版（交叉編譯，驗 SHA256）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 讀引擎釘選版本
        run: grep -E '^[A-Za-z_][A-Za-z0-9_]*=' scripts/versions.env >> "$GITHUB_ENV"
      - name: 建置並驗 SHA256
        run: |
          docker build --target theia-builder-windows -t theia-builder-windows \
            --build-arg THEIA_COMMIT="$THEIA_COMMIT" \
            --build-arg THEIA_LINUX_AMD64_SHA256="$THEIA_LINUX_AMD64_SHA256" \
            --build-arg THEIA_WINDOWS_AMD64_SHA256="$THEIA_WINDOWS_AMD64_SHA256" .
          cid=$(docker create theia-builder-windows)
          mkdir -p dist
          docker cp "$cid:/out/cbomkit-theia.exe" dist/cbomkit-theia.exe
          docker rm "$cid"
          echo "${THEIA_WINDOWS_AMD64_SHA256}  dist/cbomkit-theia.exe" | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: cbomkit-theia-windows
          path: dist/cbomkit-theia.exe
          if-no-files-found: error

  windows-package:
    name: Windows 安裝包冒煙（package.ps1 -SkipDb）
    runs-on: windows-latest
    needs: theia-windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cbomkit-theia-windows
          path: dist
      # T911 起包內必含 CBOM 引擎：不再帶 -WithoutCbom；package.ps1 取用前比對 SHA256
      - name: 組裝安裝包（跳過 1.7G DB）
        shell: pwsh
        run: pwsh scripts/package.ps1 -SkipDb
      - name: 驗證產物結構 + cytrace.exe 可跑
        shell: pwsh
        run: |
          $b = Get-ChildItem -Directory delivery | Select-Object -First 1
          $need = @("bin\cytrace.exe","bin\syft.exe","bin\grype.exe","bin\cbomkit-theia.exe","cytrace-offline.ps1","SHA256SUMS","NOTICE","cytrace.sbom.cdx.json","CHANGELOG.md")
          foreach ($f in $need) { if (-not (Test-Path (Join-Path $b.FullName $f))) { throw "missing $f" } }
          & (Join-Path $b.FullName "bin\cytrace.exe") --version
      # NOTICE 與包內實際內容必須一致——否則會出一個授權聲明不實的交付包（ADR-013）
      - name: NOTICE 與包內引擎一致
        shell: pwsh
        run: |
          $b = Get-ChildItem -Directory delivery | Select-Object -First 1
          $notice = Get-Content (Join-Path $b.FullName "NOTICE") -Raw
          if (-not ($notice -match "does not cover the nationality")) {
            throw "NOTICE 缺少禁中國來源宣告的涵蓋範圍註記"
          }
          # ring 為 ISC 與 OpenSSL/BoringSSL 混合授權，須保留聲明；Windows 交付同樣含
          # cytrace serve 故同樣連結 ring。第六輪複審 finding J：ps1 曾整段漏掉。
          foreach ($t in @("ring", "rustls", "cargo-deny")) {
            if (-not ($notice -match [regex]::Escape($t))) {
              throw "NOTICE 缺 $t 段（Windows 交付同樣連結 ring，授權聲明不得省略）"
            }
          }
          if (Test-Path (Join-Path $b.FullName "bin\cbomkit-theia.exe")) {
            foreach ($t in @("CBOMkit-theia","MPL-2.0","gitleaks")) {
              if (-not ($notice -match [regex]::Escape($t))) { throw "包內含 theia 但 NOTICE 缺 $t" }
            }
          } else {
            if (-not ($notice -match "does not include the CBOM engine")) {
              throw "包內無 theia 但 NOTICE 未明示"
            }
          }
          Write-Host "NOTICE 與包內引擎一致"
          Write-Host "OK package: $($b.Name)"
      # 「編得出來」不等於「在 Windows 上跑得起來」：以真引擎跑憑證與空目錄兩個情境（T911）。
      # 用的是包內那一支（與交付相同），不是另外建的。
      - name: 真引擎在 Windows 上可用（CBOM 煙霧）
        shell: pwsh
        run: |
          $b = Get-ChildItem -Directory delivery | Select-Object -First 1
          $env:PATH = (Join-Path $b.FullName "bin") + ";" + $env:PATH
          cargo test -p cytrace-core --test real_engine_windows -- --ignored
          if ($LASTEXITCODE -ne 0) { throw "real_engine_windows failed (exit $LASTEXITCODE)" }
