name: CI

on:
  push:
    branches: [main, 'asp/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    name: Rust（fmt / clippy / test / golden）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain（釘選於 rust-toolchain.toml）
        run: rustup show
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy（-D warnings）
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test（含 golden baseline）
        run: cargo test --workspace
      - name: 純 CLI 可退（--no-default-features 零 tokio，CLI 零迴歸）
        run: cargo build --no-default-features -p cytrace-cli --locked
      - name: 零 HTTP client 依賴（零外連機械保證，ADR-011）
        run: |
          if cargo tree -e normal 2>/dev/null | grep -iE 'reqwest|hyper-tls|native-tls|(^| )ureq( |$)|(^| )curl( |$)'; then
            echo "✗ 依賴樹出現 HTTP client（違反零外連鐵則）"; exit 1
          else
            echo "✓ 依賴樹無 HTTP client"
          fi
      - name: i18n 鍵一致（NFR-06）
        run: python3 scripts/i18n-check.py
      # 兩支打包腳本各寫一份 NOTICE，改一邊忘一邊就出授權聲明不實的交付包
      - name: NOTICE 兩平台對帳（ADR-013）
        run: python3 scripts/notice-parity-check.py

  real-engine:
    name: 真引擎整合測試（CBOM × 真實輸入形態，ADR-013）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain（釘選於 rust-toolchain.toml）
        run: rustup show
      - name: 讀引擎釘選版本
        run: grep -E '^[A-Za-z_][A-Za-z0-9_]*=' scripts/versions.env >> "$GITHUB_ENV"
      # 與交付鏈同一條建置路徑（Dockerfile theia-builder stage），確保測的是會出貨的那支
      - name: 建置 cbomkit-theia（自源碼，驗 SHA256）
        run: |
          docker build --target theia-builder -t theia-builder .
          cid=$(docker create theia-builder)
          docker cp "$cid:/out/cbomkit-theia" /usr/local/bin/cbomkit-theia
          docker rm "$cid"
          chmod +x /usr/local/bin/cbomkit-theia
          echo "${THEIA_LINUX_AMD64_SHA256}  /usr/local/bin/cbomkit-theia" | sha256sum -c -
      # M9 六輪複審中，第四輪之後的全部阻斷級都只有真引擎跑得出來（零資產目標輸出 null、
      # dir 模式追隨 symlink、FIFO 掛死、OpenSSH 金鑰只在 stderr 留痕、憑證計數欄位名與想像不符）
      - name: 真引擎 × 真實輸入形態
        run: make test-real-engine

  supply-chain:
    name: 供應鏈（cargo-deny：license / 來源白名單）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses sources bans

  frontend:
    name: 前端（typecheck + 報表/console build + 零外連）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: install
        run: cd frontend && pnpm install --frozen-lockfile
      - name: typecheck
        run: cd frontend && pnpm typecheck
      - name: build 報表（單檔內聯）
        run: cd frontend && pnpm build
      - name: 報表 sentinel 未污染（console 不得破壞注入契約 ADR-009）
        run: |
          if ! grep -q '<!--CYTRACE_DATA-->' frontend/dist/index.html; then
            echo "✗ 報表 sentinel 遺失（注入契約被破壞）"; exit 1
          fi
          echo "✓ 報表 sentinel 完整"
      - name: 零外連自檢（報表不得有外部 http(s) 資源）
        run: |
          if grep -nE 'src="https?://|href="https?://' frontend/dist/index.html; then
            echo "✗ 報表含外部資源（違反 air-gapped）"; exit 1
          else
            echo "✓ 報表零外部資源"
          fi
      - name: build console SPA
        run: cd frontend && pnpm build:console
      - name: console 零外連自檢
        run: bash scripts/console-egress-check.sh frontend/dist-console

  windows-package:
    name: Windows 安裝包冒煙（package.ps1 -SkipDb）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: 組裝安裝包（跳過 1.7G DB）
        shell: pwsh
        run: pwsh scripts/package.ps1 -SkipDb
      - name: 驗證產物結構 + cytrace.exe 可跑
        shell: pwsh
        run: |
          $b = Get-ChildItem -Directory delivery | Select-Object -First 1
          $need = @("bin\cytrace.exe","bin\syft.exe","bin\grype.exe","cytrace-offline.ps1","SHA256SUMS","NOTICE","cytrace.sbom.cdx.json")
          foreach ($f in $need) { if (-not (Test-Path (Join-Path $b.FullName $f))) { throw "missing $f" } }
          & (Join-Path $b.FullName "bin\cytrace.exe") --version
      # NOTICE 與包內實際內容必須一致——否則會出一個授權聲明不實的交付包（ADR-013）
      - name: NOTICE 與包內引擎一致
        shell: pwsh
        run: |
          $b = Get-ChildItem -Directory delivery | Select-Object -First 1
          $notice = Get-Content (Join-Path $b.FullName "NOTICE") -Raw
          if (-not ($notice -match "does not cover the nationality")) {
            throw "NOTICE 缺少禁中國來源宣告的涵蓋範圍註記"
          }
          # ring 為 ISC 與 OpenSSL/BoringSSL 混合授權，須保留聲明；Windows 交付同樣含
          # cytrace serve 故同樣連結 ring。第六輪複審 finding J：ps1 曾整段漏掉。
          foreach ($t in @("ring", "rustls", "cargo-deny")) {
            if (-not ($notice -match [regex]::Escape($t))) {
              throw "NOTICE 缺 $t 段（Windows 交付同樣連結 ring，授權聲明不得省略）"
            }
          }
          if (Test-Path (Join-Path $b.FullName "bin\cbomkit-theia.exe")) {
            foreach ($t in @("CBOMkit-theia","MPL-2.0","gitleaks")) {
              if (-not ($notice -match [regex]::Escape($t))) { throw "包內含 theia 但 NOTICE 缺 $t" }
            }
          } else {
            if (-not ($notice -match "does not include the CBOM engine")) {
              throw "包內無 theia 但 NOTICE 未明示"
            }
          }
          Write-Host "NOTICE 與包內引擎一致"
          Write-Host "OK package: $($b.Name)"
