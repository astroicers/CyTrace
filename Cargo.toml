# CyTrace — Cargo workspace（ADR-001：Rust 核心）
[workspace]
resolver = "2"
members = [
    "crates/cytrace-types",
    "crates/cytrace-core",
    "crates/cytrace-i18n",
    "crates/cytrace-report",
    "crates/cytrace-server",
    "crates/cytrace-cli",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/astroicers/CyTrace"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# 內部 crate（模組邊界鐵律見 SDS §2）
cytrace-types = { path = "crates/cytrace-types" }
cytrace-core = { path = "crates/cytrace-core" }
cytrace-i18n = { path = "crates/cytrace-i18n" }
cytrace-report = { path = "crates/cytrace-report" }
cytrace-server = { path = "crates/cytrace-server" }

# Web 服務模式（ADR-011；features 最小化、禁任何 HTTP client）
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "macros", "signal", "time"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "multipart"] }
# 上傳壓縮包安全解壓（ADR-011 §6；純 Rust、features 最小化）
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
argon2 = "0.5"
getrandom = "0.2"
rpassword = "7"
sha2 = "0.10"
rust-embed = "8"
mime_guess = "2"
# TLS：自帶 PEM 憑證（ADR-011；ring provider——musl/msvc 皆可建、免 cmake）
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
# 測試用（oneshot router 測試，不開真實 socket）
tower = { version = "0.5", default-features = false, features = ["util"] }
http-body-util = "0.1"
# 測試專用：以 AST 實作的機械閘（i18n 棘輪、禁止 closure handler）。原本的手寫字元掃描器
# 每輪複審都被 raw string、跨行字串、match arm 上的 cfg(test) 等形狀繞過（T909 第四輪複審）。
# 三者皆已在 Cargo.lock（syn 2.0.118 / proc-macro2 1.0.106 / quote 1.0.46，經由 derive 巨集），不引入新來源。
syn = { version = "2", default-features = false, features = ["full", "visit", "parsing", "printing"] }
proc-macro2 = "1"
quote = "1"

# 穩定優先（NFR-02）：release 以體積/可重現為先
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
